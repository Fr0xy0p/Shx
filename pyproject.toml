[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shx-cli"
version = "0.1.0"
description = "AI-Assisted Terminal & Shell Command Assistant with AST Safety Guardrails"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yuvraj" }]
keywords = ["cli", "terminal", "ai", "bash", "zsh", "guardrails", "groq", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "bashlex>=0.18",
    "pydantic>=2.7.0",
    "openai>=1.30.0",
    "google-genai>=0.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
build = [
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.scripts]
shx = "shx.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shx*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
